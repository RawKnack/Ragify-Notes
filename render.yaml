services:
  - type: web
    name: ragify-notes
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/stats
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
